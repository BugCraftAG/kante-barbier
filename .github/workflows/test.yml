name: Tests

# Läuft derzeit nur auf Knopfdruck (Actions → Tests → Run workflow).
# Wieder automatisch bei jedem Push: die Zeilen unten einkommentieren.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
